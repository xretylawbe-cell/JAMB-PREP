 #view,#view.full{margin-left:210px;max-width:none}#view:not(.full){padding:20px 28px}iframe{height:calc(100vh - 56px)}}

const db=window.supabase.createClient("https://hsjaopfkyltvjpsxhdii.supabase.co","sb_publishable_UXN0budPmcKVEIcUKepfqA___bLRhpK");

async function enter(u){me=u;const {data}=await db.from("profiles").select("*").eq("id",u.id).maybeSingle();
 if(!data||!["admin","teacher"].includes(data.role)){await db.auth.signOut();return msg("lm","This account does not have staff access. Ask an admin to give you a role.","err")}

 if(FRAMES[v]){el.innerHTML=`<iframe src="${FRAMES[v]}" title="${n[2]}"></iframe>`;return}
 el.innerHTML='<p class="muted">Loading...</p>';({home,teaching,courses,team,payroll,notify,me:meView})[v]()}
/* home */
async function home(){const cnt=(t,f)=>f(db.from(t).select("id",{count:"exact",head:true})).then(r=>r.count??"-").catch(()=>"-");
 const any=can("staff")||can("tasks")||can("payments")||can("promos")||can("courses");let s="";
 if(any){const [a,b,c,d]=await Promise.all([cnt("profiles",q=>q.eq("role","student")),cnt("student_courses",q=>q.gt("access_until",new Date().toISOString())),cnt("class_sessions",q=>q.eq("is_live",true)),can("tasks")?cnt("task_submissions",q=>q.eq("status","pending")):Promise.resolve("-")]);
  let rev="-";if(can("payments")){const {data}=await db.from("payments").select("amount_kobo").eq("status","success").limit(2000);rev="₦"+Math.round((data||[]).reduce((x,y)=>x+Number(y.amount_kobo),0)/100).toLocaleString()}
  s=`<div class="stats"><div class="stat"><b>${a}</b><span class="muted">Students</span></div><div class="stat"><b>${b}</b><span class="muted">Active courses</span></div><div class="stat"><b>${c}</b><span class="muted">Live classes now</span></div>${can("tasks")?`<div class="stat"><b>${d}</b><span class="muted">Tasks to review</span></div>`:""}${can("payments")?`<div class="stat"><b>${rev}</b><span class="muted">Payments received</span></div>`:""}</div>`}
 $("view").innerHTML=`<h2 style="margin-bottom:6px">Welcome, ${esc((prof.full_name||"").split(" ")[0]||"there")}</h2><p class="muted">${prof.role==="admin"?"You have full access.":"You can open the sections below."}</p>${s}<div class="tiles">${NAV.filter(n=>n[0]!=="home"&&n[3]()).map(n=>`<button class="tile" data-v="${n[0]}"><span>${n[1]}</span><b>${n[2]}</b></button>`).join("")}</div>`}
$("view").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)go(b.dataset.v)});
/* courses: you only set the price and whether it is offered */
let cs=[];
async function courses(){const {data,error}=await db.from("courses").select("*").order("sort_order");if(error)return $("view").innerHTML=`<div class="note err">${esc(error.message)}</div>`;cs=data||[];
 $("view").innerHTML=`<h2>Courses and prices</h2><p class="muted">Subjects come from each course's JAMB combination automatically. Set the monthly price and choose which courses are offered. A price of 0 means free. Students only see prices once you open subscriptions.</p><div class="field"><input id="cq" placeholder="Search courses"></div><div id="cl"></div><div id="cm"></div>`;
 $("cq").oninput=drawCourses;drawCourses()}
function drawCourses(){const q=($("cq")?.value||"").toLowerCase(),by={};cs.filter(c=>!q||c.name.toLowerCase().includes(q)).forEach(c=>(by[c.category||"Other"]??=[]).push(c));
 $("cl").innerHTML=Object.entries(by).map(([k,l])=>`<div class="cat">${esc(k)}</div>`+l.map(c=>`<div class="item row"><span class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.description||"")}</div></span><span style="width:130px"><input type="number" min="0" data-pr="${c.id}" value="${c.monthly_price}" aria-label="Monthly price in naira"></span><label class="row" style="gap:6px"><input type="checkbox" data-pb="${c.id}" ${c.is_published?"checked":""} style="width:18px;height:18px">Offered</label><button class="btn" data-sc="${c.id}">Save</button></div>`).join("")).join("")||'<p class="muted">No courses match.</p>'}
$("view").addEventListener("click",async e=>{const b=e.target.closest("[data-sc]");if(!b)return;const id=+b.dataset.sc;b.disabled=true;
 const r=await db.from("courses").update({monthly_price:+document.querySelector(`[data-pr="${id}"]`).value||0,is_published:document.querySelector(`[data-pb="${id}"]`).checked}).eq("id",id);
 b.disabled=false;msg("cm",r.error?r.error.message:"Saved.",r.error?"err":"ok");if(!r.error){const c=cs.find(x=>x.id===id);c.monthly_price=+document.querySelector(`[data-pr="${id}"]`).value||0;c.is_published=document.querySelector(`[data-pb="${id}"]`).checked}});
/* team: roles and access */
const PERMS=[["courses","Set course prices"],["promos","Free events, codes and settings"],["tasks","Review student tasks"],["payments","See payments"],["staff","Manage the team"],["notify","Send notifications to students"]];
async function team(){const {data,error}=await db.rpc("list_staff");if(error)return $("view").innerHTML=`<div class="note err">${esc(error.message)}</div>`;
 $("view").innerHTML=`<h2>Team and roles</h2><p class="muted">Admins can do everything. Teachers can manage lessons, questions and live classes, plus any extra access you tick. The person must sign up in the student app first.</p>
 <div class="card"><h3>Give or change a role</h3><div class="field"><label>Their email</label><input id="te" type="email"></div>
 <div class="field"><label>Role</label><select id="tr"><option value="teacher">Teacher</option><option value="admin">Admin (full access)</option><option value="student">Student (remove staff access)</option></select></div>
 <div id="tp"><label class="muted" style="font-weight:700">Extra access for a teacher</label>${PERMS.map(p=>`<label class="chk"><input type="checkbox" value="${p[0]}">${p[1]}</label>`).join("")}</div>
 <button class="btn hi" id="ts" style="margin-top:8px">Save</button><div id="tm"></div></div><div id="tc"></div><h3 style="margin:6px 0 10px">Current team</h3>
 ${(data||[]).map(s=>`<div class="item row"><span class="grow"><b>${esc(s.name||"No name")}</b><div class="muted">${esc(s.email)}</div></span><span class="tag ${s.role==="admin"?"g":""}">${esc(s.role)}</span><span class="muted">${s.role==="admin"?"Full access":(s.permissions||[]).length?esc(s.permissions.join(", ")):"Lessons, questions, classes"}</span><button class="btn sec" data-edit="${esc(s.email)}" data-id="${s.id}" data-name="${esc(s.name||s.email)}" data-role="${s.role}" data-perms="${esc((s.permissions||[]).join(","))}">Edit</button></div>`).join("")}`;

 $("ts").onclick=async()=>{const perms=[...document.querySelectorAll("#tp input:checked")].map(i=>i.value);
  const {error}=await db.rpc("set_staff",{p_email:$("te").value.trim(),p_role:$("tr").value,p_perms:$("tr").value==="teacher"?perms:[]});

$("view").addEventListener("click",e=>{const b=e.target.closest("[data-edit]");if(!b)return;$("te").value=b.dataset.edit;$("tr").value=b.dataset.role==="student"?"teacher":b.dataset.role;$("tr").onchange();

async function teaching(){const {data:s,error}=await db.rpc("my_teacher_summary");if(error)return $("view").innerHTML=`<div class="note err">${esc(error.message)}</div>`;const n=x=>"₦"+Number(x||0).toLocaleString();
 $("view").innerHTML=`<h2>My teaching</h2>

 <div class="stats"><div class="stat"><b>${s.held_month}</b><span class="muted">Classes this month</span></div><div class="stat"><b>${s.held_total}</b><span class="muted">Classes held in total</span></div><div class="stat"><b>${s.students_active}</b><span class="muted">Active students (of ${s.students_total})</span></div></div>

 <h3 style="margin:18px 0 8px">Earnings</h3><div class="card"><div class="row" style="justify-content:space-between"><span>Monthly salary</span><b>${n(s.monthly_salary)}</b></div><div class="row" style="justify-content:space-between"><span>Extra per class held</span><b>${n(s.per_class_rate)}</b></div><div class="row" style="justify-content:space-between"><span>Estimate for this month</span><b>${n(s.estimate)}</b></div></div>

 $("view").innerHTML=`<h2>Teacher payroll</h2><p class="muted">Pick a month and tap Calculate. Pay is the monthly salary plus the per-class amount for classes held that month. Set each teacher's pay on the Team page. Months already marked paid are never changed.</p><div class="row"><input type="month" id="pp_m" value="${per}" style="max-width:200px"><button class="btn hi" id="pp_g">Calculate</button></div><div id="pp_msg"></div><div id="pp_l" style="margin-top:12px"></div>`;
 const load=async()=>{const {data,error}=await db.rpc("list_payroll",{p_period:$("pp_m").value});if(error)return msg("pp_msg",error.message,"err");
  $("pp_l").innerHTML=(data||[]).map(p=>`<div class="item row"><span class="grow"><b>${esc(p.name||p.email)}</b><div class="muted">${p.classes} classes${p.paid_at?", paid "+esc(new Date(p.paid_at).toLocaleDateString()):""}</div></span><b>₦${Number(p.amount).toLocaleString()}</b><span class="tag ${p.status==="paid"?"g":""}">${p.status==="paid"?"Paid":"Pending"}</span><button class="btn sec" data-pay="${p.id}" data-to="${p.status==="paid"?0:1}">${p.status==="paid"?"Mark unpaid":"Mark paid"}</button></div>`).join("")||'<p class="muted">Nothing calculated for this month yet. Tap Calculate.</p>'};
 $("pp_m").onchange=load;

 $("pp_l").onclick=async e=>{const b=e.target.closest("[data-pay]");if(!b)return;const {error}=await db.rpc("mark_payroll",{p_id:+b.dataset.pay,p_paid:b.dataset.to==="1",p_note:null});if(error)alert(error.message);load()};load()}
function problemsH(){let a=[];try{a=JSON.parse(localStorage.getItem("app_errors")||"[]")}catch(e){}
 return `<div class="card"><h3>Problem report</h3><p class="muted">${a.length?a.length+" problem(s) were recorded on this device. If something is not working, copy this and send it to support.":"No problems recorded on this device."}</p>${a.length?`<textarea readonly id="pr_t" style="width:100%;min-height:90px;font-size:12px">${esc(a.map(x=>x.t.slice(0,19).replace("T"," ")+"  "+x.p+"  "+x.m).join("\n"))}</textarea><div class="row" style="margin-top:8px"><button class="btn sec" id="pr_c">Copy</button><button class="btn sec" id="pr_x">Clear</button></div>`:""}</div>`}
$("view").addEventListener("click",e=>{const id=e.target.id;if(id==="pr_c"){const t=$("pr_t");t.select();try{navigator.clipboard.writeText(t.value)}catch(x){try{document.execCommand("copy")}catch(y){}}}
 else if(id==="pr_x"){try{localStorage.removeItem("app_errors")}catch(x){}meView()}
 else if(e.target.dataset&&e.target.dataset.nd){db.from("notifications").delete().eq("id",+e.target.dataset.nd).then(()=>{if(view==="notify")notify()})}});
/* notifications */
async function notify(){const [cr,ls]=await Promise.all([db.from("courses").select("id,name").order("name"),db.from("notifications").select("*, notification_reads(count)").order("created_at",{ascending:false}).limit(30)]);
 $("view").innerHTML=`<h2>Notifications</h2><p class="muted">Messages students see under the 🔔 bell at the top of the app.</p>
 <div class="card"><div class="field"><label>Title</label><input id="nt"></div><div class="field"><label>Message</label><textarea id="nb"></textarea></div>
 <div class="field"><label>Picture (optional)</label><input type="file" id="nf" accept="image/*"></div><div class="field"><label>Link (optional, starts with https://)</label><input id="nl"></div>
 <div class="field"><label>Send to</label><select id="na"><option value="all">Everyone</option><option value="course">Students in one course</option><option value="student">One student</option></select></div>
 <div class="field hid" id="nc_w"><label>Course</label><select id="nc">${(cr.data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
 <div class="field hid" id="ne_w"><label>Student's email</label><input id="ne" type="email"></div>
 <div class="field"><label>Stop showing on (optional)</label><input id="nx" type="datetime-local"></div>
 <button class="btn hi" id="ns">Send notification</button><div id="nm"></div></div>
 <h3 style="margin:6px 0 10px">Sent</h3>${(ls.data||[]).map(n=>`<div class="item row"><span class="grow"><b>${esc(n.title)}</b><div class="muted">${n.audience==="all"?"Everyone":n.audience==="course"?"One course":"One student"}, ${esc(new Date(n.created_at).toLocaleString())}, read by ${n.notification_reads?.[0]?.count??0}</div></span><button class="btn sec" data-nd="${n.id}">Delete</button></div>`).join("")||'<p class="muted">Nothing sent yet.</p>'}`;
 $("na").onchange=()=>{$("nc_w").classList.toggle("hid",$("na").value!=="course");$("ne_w").classList.toggle("hid",$("na").value!=="student")};
 $("ns").onclick=async()=>{$("ns").disabled=true;try{const f=$("nf").files[0];let img=null;
  if(f){if(f.size>5e6)throw new Error("The picture is over 5 MB.");const p="notify/"+Date.now()+"-"+f.name.replace(/[^\w.-]/g,"_"),up=await db.storage.from("content-media").upload(p,f);if(up.error)throw up.error;img=db.storage.from("content-media").getPublicUrl(p).data.publicUrl}
  const link=$("nl").value.trim();if(link&&!/^https:\/\//i.test(link))throw new Error("The link must start with https://");
  const {error}=await db.rpc("send_notification",{p_title:$("nt").value,p_body:$("nb").value,p_image:img,p_link:link||null,p_audience:$("na").value,p_course:+$("nc").value||null,p_email:$("ne").value,p_expires:$("nx").value?new Date($("nx").value).toISOString():null});
  if(error)throw error;msg("nm","Sent. Students will see it under the bell.","ok");setTimeout(()=>{if(view==="notify")notify()},900)}catch(e){msg("nm",e.message,"err");$("ns").disabled=false}}}
/* my profile */
function meView(){setTimeout(()=>{$("view").insertAdjacentHTML("beforeend",problemsH())},0);$("view").innerHTML=`<h2>My profile</h2><div class="card"><div class="field"><label>Full name</label><input id="pn" value="${esc(prof.full_name||"")}"></div><div class="field"><label>Phone</label><input id="pp" value="${esc(prof.phone||"")}"></div>
 <div class="field"><label>About me</label><textarea id="pb">${esc(prof.bio||"")}</textarea></div><div class="field"><label>Email</label><input value="${esc(prof.email||"")}" disabled></div>
 <p class="muted">Role: <b>${esc(prof.role)}</b>${prof.role==="teacher"?". Extra access: "+((prof.permissions||[]).join(", ")||"none"):""}</p><button class="btn hi" id="ps">Save profile</button><div id="pm"></div></div>`;
 $("ps").onclick=async()=>{const r={full_name:$("pn").value.trim(),phone:$("pp").value.trim(),bio:$("pb").value.trim()};const {error}=await db.from("profiles").update(r).eq("id",me.id);
  if(error)return msg("pm",error.message,"err");Object.assign(prof,r);$("who").textContent=r.full_name+" ("+prof.role+")";msg("pm","Profile saved.","ok")}}
db.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});
})();
</script></body></html>
